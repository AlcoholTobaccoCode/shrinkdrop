<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS 风格圆角方块：内容区 824×824，四周 100px 安全边 -->
  <defs>
    <clipPath id="card"><rect x="252" y="252" width="520" height="520" rx="64"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1E293B"/>
  <g clip-path="url(#card)">
    <!-- 原图（左）：陶土色 + 山形 -->
    <rect x="252" y="252" width="260" height="520" fill="#B4532A"/>
    <path d="M252 772 L252 600 L380 470 L512 600 L512 772 Z" fill="#8E3F1E"/>
    <!-- 结果（右）：绿色 + 同一山形 -->
    <rect x="512" y="252" width="260" height="520" fill="#1F6B57"/>
    <path d="M512 772 L512 600 L644 470 L772 600 L772 772 Z" fill="#17513F"/>
  </g>
  <!-- 纸色边框与分割线 + 把手 -->
  <rect x="252" y="252" width="520" height="520" rx="64" fill="none" stroke="#F4F0E8" stroke-width="28"/>
  <rect x="496" y="206" width="32" height="612" rx="16" fill="#F4F0E8"/>
  <circle cx="512" cy="512" r="70" fill="#F4F0E8"/>
  <path d="M488 482 L458 512 L488 542 M536 482 L566 512 L536 542" fill="none" stroke="#1E293B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
