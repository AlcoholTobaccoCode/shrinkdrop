[package]
name = "tinypng-cross-platform"
version = "0.1.0"
description = "轻量匿名图片压缩桌面客户端"
authors = ["Tinypng Cross Platform"]
edition = "2021"

[lib]
name = "tinypng_cross_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
getrandom = "0.4"
same-file = "1"
