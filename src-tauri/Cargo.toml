[package]
name = "shrinkdrop"
version = "0.1.2"
description = "轻量匿名图片压缩桌面客户端"
authors = ["Tinypng Cross Platform"]
edition = "2021"

[lib]
name = "shrinkdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
socket2 = "0.5"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream", "multipart"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "fs", "io-util"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
getrandom = "0.4"
same-file = "1"
# 局域网分享面：进程内 HTTP 服务与局域网地址探测
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
argon2 = "0.5"
hmac = "0.12"
