<html lang="zh-CN"><head><meta charset="utf-8"><title>欢迎使用 shrinkdrop</title>
<style>body { text-shadow: none; }</style></head>
<body>
<h1>欢迎使用 shrinkdrop</h1>
<p>轻松压缩图片，方便地与局域网中的设备分享文件。</p>
<p>支持 PNG、JPG 和 WebP 图片，单张不超过 20 MB。</p>
<p>点击「继续」将 shrinkdrop 安装到「应用程序」文件夹。</p>
</body></html>
