<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="share-base" content="{{BASE}}" />
    <meta name="color-scheme" content="light dark" />
    <title>File Share · 局域网分享</title>
    <link rel="stylesheet" href="{{BASE}}/assets/app.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <span class="mark" aria-hidden="true">F</span>
        <div class="head-text">
          <h1>File Share</h1>
          <p class="sub">同一局域网内，点击文件即可下载</p>
        </div>
      </header>

      <ul id="files" class="files" aria-live="polite">
        <li class="empty">正在加载…</li>
      </ul>

      <footer class="foot">由 TinyPNG Lite 分享 · 文件只在你的设备与这台电脑之间传输</footer>
    </main>
    <script src="{{BASE}}/assets/app.js"></script>
  </body>
</html>
