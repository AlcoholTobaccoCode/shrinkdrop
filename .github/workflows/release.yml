name: Release desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: windows-latest
            artifact: windows-x64
            rust-targets: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis,msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Diagnose Windows test startup failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pefile
          @'
          import ctypes, glob, os, pathlib, pefile
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          kernel.GetProcAddress.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          kernel.GetProcAddress.restype = ctypes.c_void_p
          for exe in glob.glob('src-tauri/target/debug/deps/shrinkdrop_lib-*.exe'):
              print('Checking imports:', exe, flush=True)
              pe = pefile.PE(exe)
              for entry in getattr(pe, 'DIRECTORY_ENTRY_IMPORT', []):
                  name = entry.dll.decode()
                  try:
                      library = ctypes.WinDLL(name)
                  except OSError as error:
                      print('DLL LOAD FAILED:', name, str(error), flush=True)
                      continue
                  for symbol in entry.imports:
                      if symbol.name and not kernel.GetProcAddress(library._handle, symbol.name):
                          print('MISSING ENTRY:', name, symbol.name.decode(), flush=True)
                  print('DLL checked:', name, flush=True)
          '@ | python -u -
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'shrinkdrop|Entry Point|entry point' } |
            Format-List TimeCreated, ProviderName, Message
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: shrinkdrop ${{ github.ref_name }}
          releaseBody: See the assets below for installers.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --ci -- --locked
      - run: pnpm check:secrets
      - uses: actions/upload-artifact@v4
        with:
          name: shrinkdrop-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
